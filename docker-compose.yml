services:
  postgres:
    image: postgres:16-alpine
    container_name: woodshop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: woodshop
      POSTGRES_PASSWORD: woodshop
      POSTGRES_DB: woodshop_product
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodshop -d woodshop_product"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

volumes:
  postgres_data:
    driver: local
